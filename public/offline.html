<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexión · Cauce</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f7f7f5;
            color: #212529;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        main {
            max-width: 28rem;
            padding: 2rem;
            text-align: center;
        }
        .mark {
            display: inline-grid;
            place-items: center;
            width: 3rem;
            height: 3rem;
            border-radius: .9rem;
            background: #157f6b;
            color: #fff;
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
        p { color: #6c757d; line-height: 1.5; margin: 0 0 1.25rem; }
        a {
            display: inline-block;
            padding: .6rem 1rem;
            border-radius: .5rem;
            background: #157f6b;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main>
        <span class="mark" aria-hidden="true">C</span>
        <h1>Sin conexión</h1>
        <p>No pudimos conectar con Cauce. Revisa tu conexión y vuelve a intentarlo. Tus datos no se modificaron.</p>
        <a href="/inicio">Reintentar</a>
    </main>
</body>
</html>
