[package]
name = "cauce"
version = "1.0.0"
description = "Cauce para Android: ventana segura hacia la plataforma de finanzas personales"
authors = ["Edgar Guzman"]
edition = "2021"
publish = false

[lib]
# Tauri móvil compila la app como biblioteca que carga la actividad de Android.
name = "cauce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
url = "2"

[profile.release]
# APK pequeño: optimiza tamaño, sin símbolos y con LTO.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
