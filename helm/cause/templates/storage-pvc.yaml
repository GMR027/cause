apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cause-storage
  namespace: {{ .Release.Namespace }}
  labels:
    app: cause
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.storage.size }}
